<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Baca Buku - BukuSMP</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background:
                #0f172a;

            color: white;

            font-family:
                Arial,
                sans-serif;

        }


        /* =========================
           TOOLBAR
        ========================= */

        #toolbar {

            position: sticky;

            top: 0;

            z-index: 100;

            background:
                rgba(15, 23, 42, 0.97);

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.08);

            padding: 10px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.25);

        }


        /* =========================
           JUDUL
        ========================= */

        #judulBuku {

            width: 100%;

            text-align: center;

            font-size: 17px;

            font-weight: bold;

            color: white;

            margin-bottom: 10px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        /* =========================
           KONTROL
        ========================= */

        .toolbar-kontrol {

            display: flex;

            align-items: center;

            justify-content: center;

            flex-wrap: wrap;

            gap: 6px;

        }


        button {

            border: none;

            border-radius: 9px;

            padding: 9px 13px;

            background:
                #1e293b;

            color: white;

            font-size: 14px;

            font-weight: 500;

            cursor: pointer;

            transition:
                0.15s;

        }


        button:hover {

            background:
                #334155;

        }


        button:active {

            transform:
                scale(0.96);

        }


        button:disabled {

            background:
                #334155;

            color:
                #64748b;

            cursor:
                not-allowed;

            transform:
                none;

        }


        #back {

            background:
                #475569;

        }


        #prev,
        #next {

            background:
                #2563eb;

            min-width:
                42px;

        }


        #prev:hover,
        #next:hover {

            background:
                #1d4ed8;

        }


        #goPage {

            background:
                #16a34a;

        }


        #goPage:hover {

            background:
                #15803d;

        }


        #zoomOut,
        #zoomIn,
        #fullscreen {

            background:
                #1e293b;

            min-width:
                42px;

        }


        /* =========================
           INPUT
        ========================= */

        #pageInput {

            width:
                58px;

            padding:
                8px;

            border:
                1px solid
                #475569;

            border-radius:
                8px;

            background:
                #020617;

            color:
                white;

            text-align:
                center;

            font-size:
                14px;

            outline:
                none;

        }


        #pageInput:focus {

            border-color:
                #2563eb;

        }


        #pageInfo {

            min-width:
                105px;

            text-align:
                center;

            font-size:
                13px;

            color:
                #cbd5e1;

        }


        /* =========================
           STATUS
        ========================= */

        #status {

            min-height:
                100vh;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            flex-direction:
                column;

            gap:
                10px;

            color:
                #cbd5e1;

            font-size:
                16px;

        }


        /* =========================
           PDF CONTAINER
        ========================= */

        #pdfContainer {

            padding:
                20px 10px 40px;

            overflow:
                auto;

        }


        canvas {

            display:
                block;

            margin:
                0 auto;

            background:
                white;

            max-width:
                100%;

            height:
                auto;

            border-radius:
                3px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.45);

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            #toolbar {

                padding:
                    9px 6px;

            }


            #judulBuku {

                font-size:
                    15px;

                margin-bottom:
                    9px;

            }


            .toolbar-kontrol {

                gap:
                    5px;

            }


            button {

                padding:
                    8px 10px;

                font-size:
                    13px;

            }


            #prev,
            #next,
            #zoomOut,
            #zoomIn,
            #fullscreen {

                min-width:
                    38px;

            }


            #pageInfo {

                min-width:
                    auto;

                font-size:
                    12px;

            }


            #pageInput {

                width:
                    48px;

                padding:
                    7px;

            }


            #goPage {

                padding:
                    8px 10px;

            }


            #pdfContainer {

                padding:
                    12px 4px 30px;

            }


            canvas {

                max-width:
                    100vw;

            }

        }

    </style>

</head>


<body>


<!-- =========================
     TOOLBAR
========================= -->

<div id="toolbar">


    <div id="judulBuku">
        📖 Memuat buku...
    </div>


    <div class="toolbar-kontrol">


        <button id="back">
            ← Kembali
        </button>


        <button id="prev">
            ◀
        </button>


        <span id="pageInfo">
            Halaman - / -
        </span>


        <button id="next">
            ▶
        </button>


        <input
            type="number"
            id="pageInput"
            placeholder="No."
            min="1"
        >


        <button id="goPage">
            Pergi
        </button>


        <button id="zoomOut">
            −
        </button>


        <button id="zoomIn">
            +
        </button>


        <button id="fullscreen">
            ⛶
        </button>


    </div>

</div>


<!-- =========================
     STATUS
========================= -->

<div id="status">

    <div>
        📖 Memuat buku...
    </div>

</div>


<!-- =========================
     PDF
========================= -->

<div id="pdfContainer">

    <canvas id="pdfCanvas"></canvas>

</div>


<script type="module">


    // =========================
    // PDF.JS
    // =========================

    import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.3.31/pdf.min.mjs";


    pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.3.31/pdf.worker.min.mjs";


    // =========================
    // AMBIL FILE
    // =========================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const file =
        params.get("file");


    // =========================
    // ELEMENT
    // =========================

    const judulBuku =
        document.getElementById(
            "judulBuku"
        );


    const canvas =
        document.getElementById(
            "pdfCanvas"
        );


    const context =
        canvas.getContext("2d");


    const status =
        document.getElementById(
            "status"
        );


    const pageInfo =
        document.getElementById(
            "pageInfo"
        );


    const prevButton =
        document.getElementById(
            "prev"
        );


    const nextButton =
        document.getElementById(
            "next"
        );


    const zoomOutButton =
        document.getElementById(
            "zoomOut"
        );


    const zoomInButton =
        document.getElementById(
            "zoomIn"
        );


    const fullscreenButton =
        document.getElementById(
            "fullscreen"
        );


    const backButton =
        document.getElementById(
            "back"
        );


    const pageInput =
        document.getElementById(
            "pageInput"
        );


    const goPageButton =
        document.getElementById(
            "goPage"
        );


    // =========================
    // VARIABEL
    // =========================

    let pdf = null;

    let halamanSekarang = 1;

    let zoom = 1.5;


    // =========================
    // JUDUL BUKU
    // =========================

    if (file) {

        const namaFile =
            decodeURIComponent(file)
                .split("/")
                .pop()
                .replace(".pdf", "")
                .replace(/-/g, " ");


        judulBuku.textContent =
            "📖 " +
            namaFile.replace(
                /\b\w/g,
                huruf =>
                    huruf.toUpperCase()
            );

    }


    // =========================
    // LOAD PDF
    // =========================

    try {

        if (!file) {

            throw new Error(
                "File PDF tidak ditemukan."
            );

        }


        pdf =
            await pdfjsLib
            .getDocument(file)
            .promise;


        status.remove();


        tampilkanHalaman(
            halamanSekarang
        );


    } catch (error) {

        status.innerHTML = `

            <div>
                ❌ Gagal memuat buku.
            </div>

            <small>
                Pastikan file PDF tersedia.
            </small>

        `;


        console.error(error);

    }


    // =========================
    // TAMPILKAN HALAMAN
    // =========================

    async function tampilkanHalaman(
        nomor
    ) {

        if (!pdf) {
            return;
        }


        const page =
            await pdf.getPage(
                nomor
            );


        const viewport =
            page.getViewport({
                scale: zoom
            });


        canvas.width =
            viewport.width;


        canvas.height =
            viewport.height;


        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;


        pageInfo.textContent =
            `Halaman ${halamanSekarang} / ${pdf.numPages}`;


        pageInput.value =
            halamanSekarang;


        prevButton.disabled =
            halamanSekarang === 1;


        nextButton.disabled =
            halamanSekarang ===
            pdf.numPages;

    }


    // =========================
    // SEBELUMNYA
    // =========================

    prevButton.addEventListener(
        "click",
        () => {

            if (halamanSekarang > 1) {

                halamanSekarang--;

                tampilkanHalaman(
                    halamanSekarang
                );

                window.scrollTo(
                    0,
                    0
                );

            }

        }
    );


    // =========================
    // BERIKUTNYA
    // =========================

    nextButton.addEventListener(
        "click",
        () => {

            if (
                halamanSekarang <
                pdf.numPages
            ) {

                halamanSekarang++;

                tampilkanHalaman(
                    halamanSekarang
                );

                window.scrollTo(
                    0,
                    0
                );

            }

        }
    );


    // =========================
    // LOMPAT HALAMAN
    // =========================

    function pergiKeHalaman() {

        if (!pdf) {
            return;
        }


        const nomor =
            Number(
                pageInput.value
            );


        if (
            nomor >= 1 &&
            nomor <= pdf.numPages
        ) {

            halamanSekarang =
                nomor;


            tampilkanHalaman(
                halamanSekarang
            );


            window.scrollTo(
                0,
                0
            );

        } else {

            alert(
                `Masukkan halaman 1 sampai ${pdf.numPages}.`
            );

        }

    }


    goPageButton.addEventListener(
        "click",
        pergiKeHalaman
    );


    pageInput.addEventListener(
        "keydown",
        (event) => {

            if (event.key === "Enter") {

                pergiKeHalaman();

            }

        }
    );


    // =========================
    // ZOOM OUT
    // =========================

    zoomOutButton.addEventListener(
        "click",
        () => {

            if (zoom > 0.75) {

                zoom -= 0.25;

                tampilkanHalaman(
                    halamanSekarang
                );

            }

        }
    );


    // =========================
    // ZOOM IN
    // =========================

    zoomInButton.addEventListener(
        "click",
        () => {

            if (zoom < 3) {

                zoom += 0.25;

                tampilkanHalaman(
                    halamanSekarang
                );

            }

        }
    );


    // =========================
    // FULLSCREEN
    // =========================

    fullscreenButton.addEventListener(
        "click",
        async () => {

            try {

                if (
                    !document.fullscreenElement
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                } else {

                    await document
                        .exitFullscreen();

                }

            } catch (error) {

                console.log(error);

            }

        }
    );


    // =========================
    // KEYBOARD
    // =========================

    document.addEventListener(
        "keydown",
        (event) => {

            if (
                document.activeElement ===
                pageInput
            ) {

                return;

            }


            if (
                event.key === "ArrowLeft" &&
                halamanSekarang > 1
            ) {

                halamanSekarang--;

                tampilkanHalaman(
                    halamanSekarang
                );

                window.scrollTo(
                    0,
                    0
                );

            }


            if (
                event.key === "ArrowRight" &&
                pdf &&
                halamanSekarang <
                pdf.numPages
            ) {

                halamanSekarang++;

                tampilkanHalaman(
                    halamanSekarang
                );

                window.scrollTo(
                    0,
                    0
                );

            }

        }
    );


    // =========================
    // KEMBALI
    // =========================

    backButton.addEventListener(
        "click",
        () => {

            history.back();

        }
    );


</script>


</body>

</html>
